<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultChat 解密器</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #1a1a24;
  --border: #2a2a3a;
  --text-primary: #ececf1;
  --text-secondary: #8b8b9a;
  --text-muted: #55556a;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 24px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}

.header h1 {
  font-size: 28px;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.header p {
  color: var(--text-secondary);
  font-size: 14px;
}

.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.tab-btn {
  flex: 1;
  padding: 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.card h3 {
  font-size: 15px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.input-group {
  margin-bottom: 12px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.input-group input,
.input-group textarea {
  width: 100%;
  padding: 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: monospace;
  outline: none;
}

.input-group input:focus,
.input-group textarea:focus {
  border-color: var(--accent);
}

.input-group textarea {
  min-height: 100px;
  resize: vertical;
}

.btn-decrypt {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}

.btn-decrypt:hover {
  background: linear-gradient(135deg, var(--accent-hover), var(--accent));
}

.result-box {
  background: var(--bg-tertiary);
  border-radius: 8px;
  padding: 16px;
  margin-top: 16px;
  min-height: 80px;
}

.result-box.success {
  border-left: 3px solid var(--success);
}

.result-box.error {
  border-left: 3px solid var(--danger);
}

.result-box .result-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.result-box .result-text {
  font-size: 14px;
  font-family: monospace;
  word-break: break-all;
  white-space: pre-wrap;
}

.result-box.success .result-text {
  color: var(--text-primary);
}

.result-box.error .result-text {
  color: var(--danger);
}

.info-box {
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 8px;
  padding: 12px;
  margin-top: 16px;
  font-size: 12px;
  color: var(--text-secondary);
}

.info-box ul {
  margin-top: 8px;
  padding-left: 20px;
}

.info-box li {
  margin-bottom: 4px;
}

.footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
}

/* 登录遮罩 */
.login-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.login-overlay.hidden {
  display: none;
}

.login-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  width: 350px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

.login-card h2 {
  text-align: center;
  font-size: 20px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.login-card p {
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 24px;
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.btn-login:hover {
  background: linear-gradient(135deg, var(--accent-hover), var(--accent));
}
</style>
</head>
<body>

<!-- 解密器登录遮罩 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 VaultChat 解密器</h2>
    <p>请输入主密码解锁</p>
    <div class="input-group">
      <label>主密码</label>
      <input type="password" id="masterPassword" placeholder="输入主密码..." onkeydown="if(event.key==='Enter')unlockDecryptor()">
    </div>
    <button class="btn-login" onclick="unlockDecryptor()">解锁</button>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header">
    <h1>🔐 VaultChat 解密器</h1>
    <p>支持文字解密和文件解密</p>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('text')">📝 文字解密</button>
    <button class="tab-btn" onclick="switchTab('file')">📁 文件解密</button>
  </div>

  <!-- 文字解密 -->
  <div class="tab-content active" id="tab-text">
    <div class="card">
      <h3>📝 输入加密内容</h3>
      <div class="input-group">
        <label>加密内容（粘贴从网页复制的内容）</label>
        <textarea id="encryptedInput" placeholder="粘贴加密内容..." oninput="parseEncryptedInput()"></textarea>
      </div>
      <div class="input-group" style="display:none;" id="ctGroup">
        <label>ciphertext</label>
        <input type="text" id="ctInput" readonly>
      </div>
      <div class="input-group" style="display:none;" id="ivGroup">
        <label>iv</label>
        <input type="text" id="ivInput" readonly>
      </div>
      <div class="input-group">
        <label>消息密码</label>
        <input type="password" id="passwordInput" placeholder="输入发送者设置的消息密码...">
      </div>
      <button class="btn-decrypt" onclick="decryptText()">🔓 解密</button>
      
      <div class="result-box" id="textResult">
        <div class="result-label">解密结果</div>
        <div class="result-text" id="textResultText"></div>
      </div>

      <div class="info-box">
        <strong>💡 使用说明：</strong>
        <ul>
          <li>从 VaultChat 网页点击"📋 复制"按钮复制加密内容</li>
          <li>直接粘贴到上方输入框</li>
          <li>输入发送者设置的消息密码即可解密</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 文件解密 -->
  <div class="tab-content" id="tab-file">
    <div class="card">
      <h3>📁 选择加密文件</h3>
      <div class="input-group">
        <label>解密密码</label>
        <input type="password" id="filePassword" placeholder="输入文件密码...">
      </div>
      <div class="input-group">
        <label>选择.enc文件</label>
        <input type="file" id="fileInput" accept=".enc" onchange="handleFileSelect(event)">
      </div>
      <button class="btn-decrypt" onclick="decryptFile()">🔓 解密文件</button>
      
      <div class="result-box" id="fileResult">
        <div class="result-label">解密结果</div>
        <div class="result-text" id="fileResultText"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    VaultChat Decryptor | 加密通讯平台
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>

<script>
// 解密器主密码
const MASTER_PASSWORD = '!@#QWEasd123';

function unlockDecryptor() {
  const pw = document.getElementById('masterPassword').value;
  if (pw === MASTER_PASSWORD) {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainContent').style.display = 'block';
  } else {
    alert('密码错误');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function deriveKey(password, salt) {
  const key = CryptoJS.PBKDF2(password, salt, {
    keySize: 256 / 32,
    iterations: 100000,
    hasher: CryptoJS.algo.SHA256
  });
  return key;
}

function decrypt(ciphertextB64, ivB64, key) {
  const ciphertext = CryptoJS.enc.Base64.parse(ciphertextB64);
  const iv = CryptoJS.enc.Base64.parse(ivB64);
  const cipherParams = CryptoJS.lib.CipherParams.create({
    ciphertext: ciphertext
  });
  const decrypted = CryptoJS.AES.decrypt(cipherParams, key, {
    iv: iv,
    mode: CryptoJS.mode.CBC,
    padding: CryptoJS.pad.Pkcs7
  });
  return decrypted.toString(CryptoJS.enc.Utf8);
}

// 自动解析粘贴的加密内容
function parseEncryptedInput() {
  const input = document.getElementById('encryptedInput').value.trim();
  const ctGroup = document.getElementById('ctGroup');
  const ivGroup = document.getElementById('ivGroup');
  
  if (!input) {
    ctGroup.style.display = 'none';
    ivGroup.style.display = 'none';
    return;
  }
  
  try {
    let data = null;
    
    // 尝试作为base64编码的JSON解析
    try {
      data = JSON.parse(atob(input));
    } catch {
      // 尝试直接解析JSON
      try {
        data = JSON.parse(input);
      } catch {
        // 不是有效的JSON
      }
    }
    
    if (data && data.ct && data.iv) {
      document.getElementById('ctInput').value = data.ct;
      document.getElementById('ivInput').value = data.iv;
      ctGroup.style.display = 'block';
      ivGroup.style.display = 'block';
      return;
    }
  } catch (e) {}
  
  // 尝试从纯文本格式解析 "ct:..., iv:..."
  const ctMatch = input.match(/ct["\s:]+([^"',\s]+)/i);
  const ivMatch = input.match(/iv["\s:]+([^"',\s]+)/i);
  
  if (ctMatch && ivMatch) {
    document.getElementById('ctInput').value = ctMatch[1];
    document.getElementById('ivInput').value = ivMatch[1];
    ctGroup.style.display = 'block';
    ivGroup.style.display = 'block';
    return;
  }
  
  ctGroup.style.display = 'none';
  ivGroup.style.display = 'none';
}

function decryptText() {
  const ct = document.getElementById('ctInput').value.trim();
  const iv = document.getElementById('ivInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  
  const resultBox = document.getElementById('textResult');
  const resultText = document.getElementById('textResultText');
  
  if (!ct || !iv) {
    showError(resultBox, resultText, '请先粘贴有效的加密内容');
    return;
  }
  
  if (!password) {
    showError(resultBox, resultText, '请输入消息密码');
    return;
  }
  
  try {
    const salt = 'vaultchat-message-salt';
    const key = deriveKey(password, salt);
    const plaintext = decrypt(ct, iv, key);
    
    if (!plaintext) {
      showError(resultBox, resultText, '解密失败：密码可能不正确');
      return;
    }
    
    showSuccess(resultBox, resultText, plaintext);
  } catch (e) {
    showError(resultBox, resultText, '解密失败：' + e.message);
  }
}

function showSuccess(box, text, content) {
  box.className = 'result-box success';
  text.textContent = content;
}

function showError(box, text, content) {
  box.className = 'result-box error';
  text.textContent = content;
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  alert('文件解密功能需要文件密码，请输入密码后点击解密');
}

async function decryptFile() {
  const fileInput = document.getElementById('fileInput');
  const password = document.getElementById('filePassword').value;
  const resultBox = document.getElementById('fileResult');
  const resultText = document.getElementById('fileResultText');
  
  if (!fileInput.files || !fileInput.files[0]) {
    showError(resultBox, resultText, '请选择文件');
    return;
  }
  if (!password) {
    showError(resultBox, resultText, '请输入密码');
    return;
  }
  
  const file = fileInput.files[0];
  
  try {
    showSuccess(resultBox, resultText, '正在解密...');
    
    const arrayBuffer = await file.arrayBuffer();
    const data = new Uint8Array(arrayBuffer);
    
    const salt = 'vaultchat-message-salt';
    const key = CryptoJS.PBKDF2(password, salt, {
      keySize: 256 / 32,
      iterations: 100000,
      hasher: CryptoJS.algo.SHA256
    });
    
    const iv = data.slice(0, 16);
    const ciphertext = data.slice(16);
    
    // 由于文件使用AES-GCM，我们需要用cryptography风格解密
    // 这里简化处理，实际应该用Python版解密器
    showError(resultBox, resultText, '文件解密请使用Python版解密器');
    
  } catch (e) {
    showError(resultBox, resultText, '解密失败：' + e.message);
  }
}
</script>
</body>
</html>
